name: Lock conversations

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            --jq '.[] | select(.locked == false) | .number' |
            xargs -r -I{} gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/{}/lock" --input /dev/null --silent
