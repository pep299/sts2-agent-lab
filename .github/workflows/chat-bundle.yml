name: Chat bundle

on: push

concurrency:
  group: chat-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up bundle directories
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/sts2-chat/dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/sts2-chat/nuget" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '9.0.x'

      - run: make chat-bundle-prepare
      - run: make chat-bundle
      - name: Check bundle size (500 MB)
        run: test "$(stat -c%s dist/sts2-chat.tar.gz)" -le 500000000

      - name: Upload
        id: upload
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sts2-chat
          path: dist/sts2-chat.tar.gz
          compression-level: 0

      - name: Delete previous artifacts
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api \
            --paginate \
            --jq ".artifacts[].id | select(. != ${KEEP_ID})" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sts2-chat&per_page=100" |
            xargs -r -I '{}' gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
