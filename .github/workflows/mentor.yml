name: Mentor

on: push

concurrency:
  group: mentor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MENTOR_CONFIG: config/mentor.example.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: make mentor-deps
      - name: Read Rust version from upstream declaration
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("external/spire-mentor/sts2-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RUSTUP_TOOLCHAIN={version}\n")
          PYTHON
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build Mentor
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        run: make mentor-build
      - run: make mentor-test
      - run: make mentor-chat-test
      - name: Prepare Mentor for Chat
        run: |
          package="$RUNNER_TEMP/mentor-chat"
          mkdir -p "$package/localization"
          cp local/mentor/sts2_rs.abi3.so chat/mentor_chat.py chat/README.md "$package/"
          cp external/spire-mentor/LICENSE external/spire-mentor/NOTICE "$package/"
          cp external/spire-mentor/sts2-rs/LICENSE "$package/LICENSE-rust"
          for source in external/spire-mentor/sts2-pycli/localization_eng_v*; do
            if [ -d "$source" ]; then
              version="${source##*/localization_eng_}"
              cp -a "$source" "$package/localization/$version"
            fi
          done
          python3 - "$package" <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          package = Path(sys.argv[1])
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          manifest = {
              "lab_commit": git("rev-parse", "HEAD"),
              "mentor_commit": git("-C", "external/spire-mentor", "rev-parse", "HEAD"),
              "files": {
                  name: hashlib.sha256((package / name).read_bytes()).hexdigest()
                  for name in ("sts2_rs.abi3.so", "mentor_chat.py")
              },
          }
          (package / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        if: github.ref == 'refs/heads/main'
        with:
          name: mentor-chat
          path: ${{ runner.temp }}/mentor-chat/
          if-no-files-found: error
          compression-level: 0
      - name: Delete previous artifacts
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api \
            --paginate \
            --jq ".artifacts[].id | select(. != ${KEEP_ID})" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=mentor-chat&per_page=100" |
            xargs -r -I '{}' gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
