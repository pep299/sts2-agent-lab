name: Mentor

on: push

concurrency:
  group: mentor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MENTOR_CONFIG: config/mentor.example.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: make mentor-deps
      - name: Read Rust version from upstream declaration
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("external/spire-mentor/sts2-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RUSTUP_TOOLCHAIN={version}\n")
          PYTHON
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build Mentor
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        run: make mentor-build
      - run: make mentor-test
      - name: Prepare Mentor for Chat
        run: |
          package="$RUNNER_TEMP/mentor-chat"
          mkdir -p "$package"
          cp local/mentor/sts2_rs.abi3.so "$package/"
          cp -a external/spire-mentor/sts2-pycli/data/ppo "$package/models"
          cp external/spire-mentor/LICENSE "$package/LICENSE"
          cp external/spire-mentor/NOTICE "$package/NOTICE"
          cp external/spire-mentor/sts2-rs/LICENSE "$package/LICENSE-rust"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        if: github.ref == 'refs/heads/main'
        with:
          name: mentor-chat
          path: ${{ runner.temp }}/mentor-chat/
          if-no-files-found: error
          compression-level: 0
      - name: Delete previous artifacts
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api \
            --paginate \
            --jq ".artifacts[].id | select(. != ${KEEP_ID})" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=mentor-chat&per_page=100" |
            xargs -r -I '{}' gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
