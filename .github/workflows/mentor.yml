name: Mentor

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MENTOR_CONFIG: config/mentor.example.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: make mentor-deps mentor-patch
      - name: Read Rust version from upstream declaration
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("external/spire-mentor/sts2-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RUSTUP_TOOLCHAIN={version}\n")
          PYTHON
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build Mentor
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        run: make mentor-build
      - run: make mentor-test
      - name: Prepare Mentor for Chat
        run: |
          package="$RUNNER_TEMP/mentor-chat"
          mkdir -p "$package/models"
          cp local/mentor/mentor_rs.abi3.so "$package/"
          cp external/spire-mentor/sts2-pycli/data/ppo/ppo_fullrun_*_v0111vocab.onnx "$package/models/"
          cp scripts/mentor-eval.py "$package/"
          cp external/spire-mentor/LICENSE "$package/LICENSE"
          cp external/spire-mentor/NOTICE "$package/NOTICE"
          cp external/spire-mentor/sts2-rs/LICENSE "$package/LICENSE-rust"
          git rev-parse HEAD:external/spire-mentor > "$package/mentor-commit"
      - name: Verify packaged Mentor evaluator
        run: |
          cat > "$RUNNER_TEMP/policy.py" <<'PY'
          def choose(run, actions, agent):
              return actions[0] if run.phase() == 'map' and actions else None
          PY
          python3 "$RUNNER_TEMP/mentor-chat/mentor-eval.py" \
            --policy-file "$RUNNER_TEMP/policy.py" --seed 1234 --count 2 \
            --sims 1 --boss-sims 1 --trace "$RUNNER_TEMP/mentor-eval.jsonl"
          grep -q '"source": "custom"' "$RUNNER_TEMP/mentor-eval.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.ref == 'refs/heads/main'
        with:
          name: mentor-chat
          path: ${{ runner.temp }}/mentor-chat/
          compression-level: 0
          retention-days: 7
