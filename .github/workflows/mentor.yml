name: Mentor

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MENTOR_CONFIG: config/mentor.example.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: make mentor-deps mentor-patch
      - name: Read Rust version from upstream declaration
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("external/spire-mentor/sts2-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RUSTUP_TOOLCHAIN={version}\n")
          PYTHON
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build Mentor and measure CPU usage
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          nproc
          lscpu
          free -b
          date -u --iso-8601=seconds
          vmstat -w -t 1 > "$RUNNER_TEMP/mentor-vmstat.log" &
          monitor_pid=$!
          trap 'kill "$monitor_pid"' EXIT
          /usr/bin/time -v -o "$RUNNER_TEMP/mentor-build-time.txt" make mentor-build MENTOR_CARGO_FLAGS=--timings
          cat "$RUNNER_TEMP/mentor-build-time.txt"
      - run: make mentor-test
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mentor-build-timings
          path: |
            local/mentor/target/cargo-timings/cargo-timing.html
            ${{ runner.temp }}/mentor-vmstat.log
            ${{ runner.temp }}/mentor-build-time.txt
          retention-days: 7
