name: Mentor build benchmark

on:
  pull_request:
    paths:
      - .github/workflows/mentor-build-benchmark.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.profile }} / ${{ matrix.parallelism }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [upstream, local]
        parallelism: [one, all]
    steps:
      - name: Check out fixed Mentor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tfriedel/spire-mentor
          ref: 8e0e91759faad0fe4eed21b51aa6cb047f34e947
          persist-credentials: false

      - name: Record machine and toolchain
        working-directory: sts2-rs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/mentor-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mentor-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/benchmark"
          {
            git rev-parse HEAD
            uname -a
            lscpu
            free -b
            rustup show
            rustc -Vv
            cargo -V
            python3 --version
            cat rust-toolchain.toml
            sed -n '/^\[profile.release\]/,/^\[profile.wasm-release\]/p' Cargo.toml
          } 2>&1 | tee "$RUNNER_TEMP/benchmark/environment.txt"

      - name: Fetch dependencies separately
        working-directory: sts2-rs
        run: |
          /usr/bin/time -f 'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_process_rss_kib=%M\nexit_code=%x' \
            -o "$RUNNER_TEMP/benchmark/fetch.metrics" \
            cargo fetch --locked --target x86_64-unknown-linux-gnu \
            2>&1 | tee "$RUNNER_TEMP/benchmark/fetch.log"

      - name: Measure cold and warm builds
        working-directory: sts2-rs
        env:
          PROFILE: ${{ matrix.profile }}
          PARALLELISM: ${{ matrix.parallelism }}
        run: |
          jobs=1
          if [ "$PARALLELISM" = all ]; then
            jobs="$(nproc)"
          fi
          if [ "$PROFILE" = local ]; then
            export CARGO_PROFILE_RELEASE_LTO=off
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          {
            echo "profile=$PROFILE"
            echo "cargo_jobs=$jobs"
            echo "available_cpus=$(nproc)"
          } | tee "$RUNNER_TEMP/benchmark/config.txt"
          for temperature in cold warm; do
            /usr/bin/time -f 'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_process_rss_kib=%M\nexit_code=%x' \
              -o "$RUNNER_TEMP/benchmark/$temperature.metrics" \
              cargo build --frozen --release -p sts2-py --features pyo3/extension-module \
                --target x86_64-unknown-linux-gnu --jobs "$jobs" --timings \
              2>&1 | tee "$RUNNER_TEMP/benchmark/$temperature.log"
            cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" \
              "$RUNNER_TEMP/benchmark/$temperature-timing.html"
          done
          stat -c 'library_bytes=%s' "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/libsts2_rs.so" \
            | tee "$RUNNER_TEMP/benchmark/library-size.txt"

      - name: Summarize measurements
        if: always()
        run: |
          {
            echo '### ${{ matrix.profile }} / ${{ matrix.parallelism }}'
            echo '```text'
            cat "$RUNNER_TEMP/benchmark/config.txt"
            for measurement in "$RUNNER_TEMP/benchmark/"*.metrics; do
              echo "$(basename "$measurement")"
              cat "$measurement"
            done
            echo '```'
            echo 'RSS is the largest individual process, not aggregate memory. Warm reuses the target directory; it excludes remote cache transfer.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mentor-build-${{ matrix.profile }}-${{ matrix.parallelism }}
          path: ${{ runner.temp }}/benchmark/
          retention-days: 7
