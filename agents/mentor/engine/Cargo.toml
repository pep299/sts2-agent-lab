[package]
name = "sts2-mentor-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "mentor_rs"
crate-type = ["cdylib"]

[dependencies]
sts2-py = { path = "../../../external/spire-mentor/sts2-rs/crates/sts2-py" }
sts2-core = { path = "../../../external/spire-mentor/sts2-rs/crates/sts2-core" }
sts2-content = { path = "../../../external/spire-mentor/sts2-rs/crates/sts2-content" }
pyo3 = { version = "0.24", features = ["abi3-py311", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.24"

[profile.release]
lto = "fat"
codegen-units = 1
